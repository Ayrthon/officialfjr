# Netlify build config for MC FJR coming-soon site.
# Netlify auto-detects Astro, but pinning this explicitly avoids surprises.

[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS    = "--no-audit --no-fund"

# --------------------------------------------------------------------------- #
# Headers                                                                     #
# --------------------------------------------------------------------------- #

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Cache the favicon aggressively; it will rarely change.
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# Astro fingerprints assets under /_astro/ — safe to cache forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
